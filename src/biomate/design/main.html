{% extends "base.html" %}

{% block title %}BioMate - Dashboard{% end %}

{% block stuff %}
<div class="row">
  <div class="col-10 mb-5 mx-auto text-center">
    <h1 class="mt-3 display-4">BioMate Tools</h1>
  </div>
</div>

<div class="row mt-4">
  {% for m in modules %}
  <div class="col-md-6 col-lg-4 mb-4">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title text-primary">
          <a href="/module/{{ m['name'] }}" class="text-decoration-none text-primary">{{ m['title'] }}</a>
        </h5>
        <p class="card-text">{{ m['short_description'] }}</p>
      </div>
    </div>
  </div>
  {% end %}
</div>
{% end %}
