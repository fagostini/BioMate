services:
  biomate:
    build:
      context: .
      dockerfile: Dockerfile
    image: biomate:latest
    container_name: biomate
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./assets:/assets
      - ./data:/data
      - ./results:/results
      - ./inputs:/inputs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["biomate", "web-interface", "--port", "8765"]
    network_mode: host
