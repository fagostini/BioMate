<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}BioMate{% end %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BioMate - Tools for biological data processing">

  <!-- CSS -->
  <link rel="stylesheet" href="/static/css/custom-bootstrap-5-alpha.css">
  <link rel="stylesheet" href="/static/css/status_b5.css">

</head>

<body>
  <nav class="navbar navbar-expand-xl navbar-light bg-light fixed-top border-bottom shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">BioMate</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#biomate-nav-collapse" aria-controls="navbarsExampleDefault" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="biomate-nav-collapse">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item dropdown px-1">
            <a class="nav-link dropdown-toggle" href="#" id="nav_tools_dropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Tools</a>
            <div class="dropdown-menu" aria-labelledby="nav_tools_dropdown">
              {% for m in modules %}
              <a class="dropdown-item" href="/module/{{ m['name'] }}">{{ m['title'] }}</a>
              {% end %}
            </div>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid">
    {% block stuff %}
    {% end %}
  </main>

  <div class="container-fluid footer border-top pt-3">
    <p>BioMate web interface - 0.3.0</p>
  </div>

  <!-- Javascript -->
  <script src="/static/js/jquery-3.5.1.min.js"></script>
  <script src="/static/js/bootstrap-5-alpha.bundle.min.js"></script>

  {% block js %}
  {% end %}
</body>
</html>
